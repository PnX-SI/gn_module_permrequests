<div class="AccessRequestToolbar">
  <div
    class="ValidationButtons"
    *ngIf="false && withValidate && accessRequest?.cruved?.V"
  >
    <button
      mat-stroked-button
      color="primary"
      type="button"
      class="ValidationButton ValidationButton--primary"
      [class.ValidationButton--active]="currentValidationState === 'true'"
      [disabled]="validationRequestPending"
      (click)="onValidationButtonClick('true')"
    >
      Valider
    </button>
    <button
      mat-stroked-button
      color="warn"
      type="button"
      class="ValidationButton ValidationButton--warn"
      [class.ValidationButton--active]="currentValidationState === 'false'"
      [disabled]="validationRequestPending"
      (click)="onValidationButtonClick('false')"
    >
      Refuser
    </button>
  </div>
  <button
    *ngIf="accessRequest && withEdit"
    [disabled]="!accessRequest.cruved.U"
    class="AccessRequestToolbar__button"
    color="primary"
    mat-icon-button
    matTooltip="Editer"
    [routerLink]="[editRouterLink]"
  >
    <mat-icon>edit</mat-icon>
  </button>
  <button
    *ngIf="accessRequest && withInfo"
    [disabled]="!accessRequest.cruved.R"
    class="AccessRequestToolbar__button"
    color="primary"
    mat-icon-button
    matTooltip="Voir"
    [routerLink]="[infoRouterLink]"
  >
    <mat-icon>info</mat-icon>
  </button>
  <button
    *ngIf="accessRequest && withDelete"
    [disabled]="!accessRequest.cruved.D"
    color="warn"
    class="AccessRequestToolbar__button"
    mat-icon-button
    matTooltip="Supprimer"
    (click)="deleteAccessRequest()"
  >
    <mat-icon>delete</mat-icon>
  </button>
</div>
