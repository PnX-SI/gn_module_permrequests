<div class="AccessRequestToolbar">
  <button
    *ngIf="withEdit"
    [disabled]="accessRequest.cruved.U"
    class="AccessRequestToolbar__button"
    color="primary"
    mat-icon-button
    matTooltip="Editer"
    [routerLink]="[editRouterLink]"
  >
    <mat-icon>edit</mat-icon>
  </button>
  <button
    *ngIf="withInfo"
    [disabled]="accessRequest.cruved.R"
    class="AccessRequestToolbar__button"
    color="primary"
    mat-icon-button
    matTooltip="Voir"
    [routerLink]="[infoRouterLink]"
  >
    <mat-icon>info</mat-icon>
  </button>
  <button
    *ngIf="withDelete"
    [disabled]="accessRequest.cruved.D"
    color="warn"
    class="AccessRequestToolbar__button"
    mat-icon-button
    matTooltip="Supprimer"
    (click)="deleteAccessRequest()"
  >
    <mat-icon>delete</mat-icon>
  </button>
</div>
