<form
  class="AccessRequestForm"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>
  <div
    class="AccessRequestForm__field"
    *ngIf="accessRequest?.author"
  >
    <label for="author">Author</label>
    <div id="author">{{ accessRequest.author.nom_complet }}</div>
  </div>

  <div class="AccessRequestForm__field">
    <label for="description">Description</label>
    <textarea
      id="description"
      rows="4"
      formControlName="description"
    ></textarea>
  </div>

  <div class="AccessRequestForm__field">
    <label for="taxa">Taxons</label>
    <pnx-taxonomy
      id="taxa"
      [parentFormControl]="taxonSearchControl"
      displayedLabel="lb_nom"
      charNumber="3"
      listLength="20"
      (onChange)="onTaxonSelected($event)"
    ></pnx-taxonomy>
    <div
      class="AccessRequestForm__selectedTaxa"
      *ngIf="taxaControl?.value?.length"
    >
      <ul>
        <li *ngFor="let taxon of taxaControl?.value">
          {{ taxon.cd_nom }} : {{ taxon.lb_nom }}
          <button
            type="button"
            mat-icon-button
            color="warn"
            (click)="removeTaxon(taxon.cd_nom)"
            matTooltip="Retirer ce taxon"
            aria-label="Retirer ce taxon"
          >
            <mat-icon>close</mat-icon>
          </button>
        </li>
      </ul>
    </div>
    <div
      class="AccessRequestForm__error"
      *ngIf="taxaControl?.hasError('required') && taxaControl?.touched"
    >
      Vous devez sélectionner au moins un taxon.
    </div>
  </div>

  <div class="AccessRequestForm__field">
    <label for="initialization_date">Date d'initialisation</label>
    <pnx-date
      id="initialization_date"
      [defaultToday]="false"
      [parentFormControl]="initializationDateControl"
      [noMaxDate]="true"
    ></pnx-date>
  </div>

  <div class="AccessRequestForm__field">
    <label for="expiration_date">Date d'expiration</label>
    <pnx-date
      id="expiration_date"
      [defaultToday]="true"
      [parentFormControl]="expirationDateControl"
      [noMaxDate]="true"
    ></pnx-date>
    <div
      class="AccessRequestForm__error"
      *ngIf="expirationDateControl?.hasError('required') && expirationDateControl?.touched"
    >
      La date d'expiration est obligatoire.
    </div>
  </div>

  <div
    class="AccessRequestForm__error"
    *ngIf="
      form.errors?.invalidDate &&
      (initializationDateControl?.touched || expirationDateControl?.touched)
    "
  >
    La date d'initialisation doit être antérieure à la date d'expiration.
  </div>

  <div
    class="AccessRequestForm__field AccessRequestForm__field--acknowledge"
    *ngIf="shouldDisplayAcknowledgement"
  >
    <label>
      <input
        type="checkbox"
        formControlName="acknowledgeTerms"
      />
      {{ termsAcknowledgementText }}
    </label>
    <div
      class="AccessRequestForm__error"
      *ngIf="acknowledgeTermsControl?.hasError('required') && acknowledgeTermsControl?.touched"
    >
      Vous devez accepter les conditions pour poursuivre.
    </div>
  </div>

  <div class="AccessRequestForm__actions">
    <button
      type="button"
      mat-stroked-button
      color="primary"
      (click)="onReset()"
      [disabled]="form.pristine || isSaving || isSameAsAccessRequest"
    >
      Réinitialiser
    </button>
    <button
      type="submit"
      mat-flat-button
      color="primary"
      [disabled]="form.invalid || form.pristine || isSaving || isSameAsAccessRequest"
    >
      Enregistrer
    </button>
  </div>
</form>
