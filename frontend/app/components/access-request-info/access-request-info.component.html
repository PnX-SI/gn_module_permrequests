<div
  class="AccessRequestInfo"
  *ngIf="accessRequest as request"
>
  <div class="AccessRequestInfo__field">
    <label for="author">Author</label>
    <div id="author">{{ request.author?.nom_complet }}</div>
  </div>

  <div class="AccessRequestInfo__field">
    <label for="description">Description</label>
    <span
      id="description"
      rows="4"
    >{{ request.description }}</span>
  </div>

  <div class="AccessRequestInfo__field">
    <label for="initialization_date">Date d'initialisation</label>
    <div id="initialization_date">{{ request.initialization_date }}</div>
  </div>

  <div class="AccessRequestInfo__field">
    <label for="expiration_date">Expiration Date</label>
    <div id="expiration_date">{{ request.expiration_date }}</div>
  </div>
</div>
