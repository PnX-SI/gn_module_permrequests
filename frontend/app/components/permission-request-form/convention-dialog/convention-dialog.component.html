<h2 mat-dialog-title>
  <span>{{ 'Permrequests.Convention.Title' | translate }}</span>

  <button
    mat-icon-button
    mat-dialog-close
    [aria-label]="'Actions.Cancel' | translate"
  >
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content>
  <ng-container *ngIf="conventionContent | async as content; else noConventionContent">
    <div
      class="permrequests-convention-container"
      [innerHtml]="content"
    ></div>
  </ng-container>

  <ng-template #noConventionContent>
    <div class="permrequests-convention-container">
      <p> {{ 'Permrequests.Convention.NoContent' | translate }}</p>
    </div>
  </ng-template>
</mat-dialog-content>

<mat-dialog-actions>
  <button
    mat-raised-button
    mat-dialog-close
  >
    <mat-icon>cancel</mat-icon>
    {{ 'Actions.Cancel' | translate }}
  </button>

  <span class="dialog-actions-spacer"></span>

  <button
    mat-raised-button
    color="primary"
    [mat-dialog-close]="true"
    cdkFocusInitial
  >
    <mat-icon>check</mat-icon>
    {{ 'Permrequests.Convention.Validate' | translate }}
  </button>
</mat-dialog-actions>
