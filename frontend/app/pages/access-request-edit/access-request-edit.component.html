<ng-container *ngIf="accessRequest">
  <access-request-layout
    [accessRequest]="accessRequest"
    [withEdit]="false"
    [withValidate]="false"
    (updated)="onAccessRequestUpdated($event)"
  >
    <access-request-form [accessRequest]="accessRequest"></access-request-form>
  </access-request-layout>
</ng-container>
