[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gn_module_permrequests"
dynamic = ["version"]
description = "Module GeoNature de demande de permissions."
readme = { file = "README.md", content-type = "text/markdown" }
maintainers = [
  { name = "Conservatoire Botanique National Alpin", email = "geonature@cbn-alpin.fr" },
  { name = "Natural Solutions", email = "geonature@natural-solutions.eu" },
  { name = "Parcs nationaux des Écrins et des Cévennes", email = "geonature@ecrins-parcnational.fr" },
]
license = { file = "LICENSE.txt" }
dependencies = ["geonature >= 2.14"]
urls = { Repository = "https://github.com/PnX-SI/gn_module_permrequests/" }
requires-python = ">=3.9"

[project.entry-points.gn_module]
code = "gn_module_permrequests:MODULE_CODE"
label = "gn_module_permrequests:MODULE_LABEL"
picto = "gn_module_permrequests:MODULE_PICTO"
blueprint = "gn_module_permrequests.blueprint:blueprint"
config_schema = "gn_module_permrequests.config_schema:PermrequestsConfigSchema"
migrations = "gn_module_permrequests:migrations"
alembic_branch = "gn_module_permrequests:ALEMBIC_BRANCH"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"gn_module_permrequests" = ["templates/**", "static/**"]
"gn_module_permrequests.migrations" = ["**"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["backend"]

[tool.coverage.run]
source = ["gn_module_permrequests"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.black]
target-version = ["py311", "py313"]
line-length = 100
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
    | dependencies
  )/
)
'''

[tool.ruff]
# Active les règles de linting pour le tri des imports (I) et d'autres comme Flake8 (E, F)
select = ["E", "F", "I"]
line-length = 100

[tool.ruff.isort]
# Optionnel: Vous pouvez spécifier des configurations propres à isort ici,
# comme par exemple forcer un formatage spécifique
known-first-party = ["gn_module_permrequests"]
